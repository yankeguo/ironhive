# ironhive controller configuration.

# http — the controller's own HTTP server.
http:
  # listen — HTTP listen address (default :8080).
  listen: ":8080"

# kubernetes — access to the cluster hosting the managed pods.
kubernetes:
  # kubeconfig — explicit kubeconfig path; unset resolves the standard
  # loading rules ($KUBECONFIG, ~/.kube/config), with the in-cluster
  # config as fallback.
  # kubeconfig: /etc/kube/admin.conf
  # namespace — namespace managed pods live in (default: the in-cluster
  # service-account namespace, else "default").
  namespace: ironhive

# pools.<name> — a named pool of managed containers.
pools:
  default:
    # standby — how many warm pods are kept ready to assign.
    standby:
      # static — a fixed number (default 10).
      static:
        count: 10
    # podTemplate — Kubernetes pod template the pool's pods are created
    # from; labels and annotations may be set but are rarely needed. The
    # controller overrides its management labels and strips the reserved
    # ironhive.dev/allocated and ironhive.dev/lease-expires annotations.
    podTemplate:
      spec:
        # Boot an arbitrary user image under ironhive-agent: the init
        # container copies the agent binary from the agent image into a
        # shared emptyDir mounted at /opt/ironhive/bin, and the main
        # container's command overrides the image's ENTRYPOINT and CMD
        # with that copy — the agent becomes PID 1. /opt/ironhive is the
        # implant's base directory: bin/ is runtime-injected (the
        # emptyDir masks only it), etc/ stays in the image — an image
        # bakes its agent config at /opt/ironhive/etc/agent.yml (see
        # agent.example.yml). No args are needed while the defaults
        # suffice (listen :19173).
        volumes:
          - name: ironhive-bin
            emptyDir: {}
        initContainers:
          - name: install-agent
            image: ghcr.io/yankeguo/ironhive:agent-latest
            command: ["/bin/sh", "-c", "cp /ironhive-agent /opt/ironhive/bin/ironhive-agent"]
            volumeMounts:
              - name: ironhive-bin
                mountPath: /opt/ironhive/bin
        containers:
          - name: main
            image: python:3.14
            # Kubernetes replaces the image's ENTRYPOINT and CMD
            # independently: setting command without args runs the agent
            # with ZERO arguments — the image's CMD is dropped, not
            # appended (unlike docker run --entrypoint). Both are ours.
            command: ["/opt/ironhive/bin/ironhive-agent"]
            # The controller derives the agent's port from the template's
            # container ports: the one named http-ironhive wins, else the
            # first declared port, else the default 19173.
            ports:
              - name: http-ironhive
                containerPort: 19173
            # The controller hands out pods once they are Ready; gate the
            # Ready condition on the agent actually serving, so an
            # allocated sandbox never 502s on first contact. Not
            # enforced by the controller — declared per template.
            readinessProbe:
              httpGet:
                path: /healthz
                port: http-ironhive
            volumeMounts:
              - name: ironhive-bin
                mountPath: /opt/ironhive/bin
