# ironhive controller configuration.

# http — the controller's own HTTP server.
http:
  # listen — HTTP listen address (default :8080).
  listen: ":8080"

# kubernetes — access to the cluster hosting the managed pods.
kubernetes:
  # kubeconfig — explicit kubeconfig path; unset resolves the standard
  # loading rules ($KUBECONFIG, ~/.kube/config), with the in-cluster
  # config as fallback.
  # kubeconfig: /etc/kube/admin.conf
  # namespace — namespace managed pods live in (default: the in-cluster
  # service-account namespace, else "default").
  namespace: ironhive

# pools.<name> — a named pool of managed containers.
pools:
  default:
    # standby — how many warm pods are kept ready to assign.
    standby:
      # static — a fixed number (default 10).
      static:
        count: 10
    # podTemplate — Kubernetes pod template the pool's pods are created
    # from; labels and annotations may be set but are rarely needed. The
    # controller overrides its management labels and strips the reserved
    # ironhive.dev/allocated and ironhive.dev/lease-expires annotations.
    podTemplate:
      spec:
        # Boot an arbitrary user image under ironhive-agent: the init
        # container copies the agent binary from the agent image into a
        # shared emptyDir, and the main container's command + args
        # override the image's ENTRYPOINT and CMD with that copy — the
        # agent becomes PID 1. The listen address is passed explicitly
        # (the agent takes flags only, no environment variables);
        # :19173 is the default anyway.
        volumes:
          - name: ironhive-bin
            emptyDir: {}
        initContainers:
          - name: install-agent
            image: ghcr.io/yankeguo/ironhive:agent-latest
            command: ["/bin/sh", "-c", "cp /ironhive-agent /.ironhive/bin/ironhive-agent"]
            volumeMounts:
              - name: ironhive-bin
                mountPath: /.ironhive/bin
        containers:
          - name: main
            image: python:3.14
            command: ["/.ironhive/bin/ironhive-agent"]
            args: ["-listen", ":19173"]
            # The controller hands out pods once they are Ready; gate the
            # Ready condition on the agent actually serving, so an
            # allocated sandbox never 502s on first contact. Not
            # enforced by the controller — declared per template.
            readinessProbe:
              httpGet:
                path: /healthz
                port: 19173
            volumeMounts:
              - name: ironhive-bin
                mountPath: /.ironhive/bin
    # agent — the ironhive-agent endpoint inside each pod.
    agent:
      # port — port the agent listens on (default 19173).
      port: 19173
