{{define "head"}}
<link href="{{cssAsset "main"}}" rel="stylesheet">
{{end}}

{{define "nav"}}
<header class="fixed inset-x-0 top-0 z-40 border-b border-neutral-700 bg-neutral-900">
  <div class="flex items-center gap-4 px-4 py-3">
    <a class="flex items-center gap-1.5 text-xl font-semibold text-white" href="/"><span class="icon-[lucide--rocket]" aria-hidden="true"></span> ironhive</a>
    <nav class="me-auto flex gap-1" aria-label="Primary">
      <a class="nav-link{{if eq .Nav "home"}} active{{end}}" href="/"{{if eq .Nav "home"}} aria-current="page"{{end}}><span class="icon-[lucide--house]" aria-hidden="true"></span> Home</a>
      <a class="nav-link{{if eq .Nav "about"}} active{{end}}" href="/about"{{if eq .Nav "about"}} aria-current="page"{{end}}><span class="icon-[lucide--info]" aria-hidden="true"></span> About</a>
    </nav>
  </div>
</header>
{{end}}
